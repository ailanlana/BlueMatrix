plugins {
    id 'java-library'
}

repositories {
    mavenCentral()
    maven {
        url 'https://maven.petrus.dev/public'
    }
}

dependencies {
    compileOnly project(":core:bluematrix-core")
    compileOnlyApi 'br.com.finalcraft.everydatabase:everydatabase-core:1.0.5'
    compileOnlyApi 'br.com.finalcraft.everydatabase:everydatabase-manager:1.0.5'
    compileOnlyApi 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.22.0'
    compileOnlyApi 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.22.0'

    testImplementation project(":core:bluematrix-core")
    testImplementation project(":core:bluematrix-logging")
    testImplementation 'br.com.finalcraft.everydatabase:everydatabase-core:1.0.5'
    testImplementation 'br.com.finalcraft.everydatabase:everydatabase-manager:1.0.5'
    testImplementation 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.22.0'
    testImplementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.22.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.reflections:reflections:0.10.2'
    testRuntimeOnly 'org.slf4j:slf4j-api:1.7.36'
    testRuntimeOnly 'ch.qos.logback:logback-classic:1.2.13'
}

test {
    useJUnitPlatform()
}
