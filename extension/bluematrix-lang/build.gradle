plugins {
    id 'java-library'
}

dependencies {
    compileOnly project(":core:bluematrix-core")
    compileOnly project(":extension:bluematrix-config")
    compileOnly project(":core:bluematrix-logging")

    testImplementation project(":core:bluematrix-core")
    testImplementation project(":extension:bluematrix-config")
    testImplementation project(":core:bluematrix-logging")
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.reflections:reflections:0.10.2'
    testImplementation 'me.carleslc.Simple-YAML:Simple-Yaml:1.8.4'
    testRuntimeOnly 'org.slf4j:slf4j-api:1.7.36'
    testRuntimeOnly 'ch.qos.logback:logback-classic:1.2.13'
}

test {
    useJUnitPlatform()
}
